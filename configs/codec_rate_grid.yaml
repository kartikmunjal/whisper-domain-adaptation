schema_version: 1
sample_rate: 16000
strides: [4, 4, 4, 5]
frame_rate_hz: 50
seeds: [11, 22, 33, 44, 55]
training:
  train_manifest: data/financial_research/train_manifest.parquet
  clip_seconds: 4.0
  hidden_dim: 128
  latent_dim: 64
  batch_size: 8
  epochs: 30
  learning_rate: 0.0003
rates:
  - label: 300bps
    nominal_bits_per_frame: 6
    vq_codebook_size: 64
    fsq_levels: [4, 4, 4]
  - label: 400bps
    nominal_bits_per_frame: 8
    vq_codebook_size: 256
    fsq_levels: [4, 4, 4, 4]
  - label: 500bps
    nominal_bits_per_frame: 10
    vq_codebook_size: 1024
    fsq_levels: [4, 4, 4, 4, 4]
