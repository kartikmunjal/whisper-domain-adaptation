model:
  base_model: openai/whisper-small
  language: en
  task: transcribe

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules: [q_proj, v_proj, k_proj, out_proj, fc1, fc2]
  bias: none

data:
  sample_rate: 16000

training:
  output_dir: checkpoints/medical_research
  num_train_epochs: 5
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 16
  dataloader_num_workers: 0
  learning_rate: 5.0e-5
  warmup_steps: 5
  logging_steps: 5
  fp16: true
  gradient_checkpointing: false
  early_stopping_patience: 5
  push_to_hub: false

evaluation:
  domain_terms_file: configs/medical_terms.txt
  output_dir: experiments/results/medical_research
